<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif">
  <text x="410" y="26" text-anchor="middle" font-size="14" font-weight="bold">Figure 5.6: Ablation Study Conditions — MedOracle Evaluation Plan</text>

  <!-- Column headers -->
  <rect x="20" y="45" width="780" height="36" rx="4" fill="#2c3e50" stroke="#1a252f" stroke-width="1.5"/>
  <text x="75"  y="68" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Condition</text>
  <text x="230" y="68" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Physiological (M1)</text>
  <text x="390" y="68" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Video (M2)</text>
  <text x="570" y="68" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Fusion Strategy</text>
  <text x="740" y="68" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Purpose</text>

  <!-- Section: Main ablation -->
  <rect x="20" y="81" width="780" height="18" rx="0" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
  <text x="410" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#495057">Main Ablation Study</text>

  <!-- C1 -->
  <rect x="20"  y="99" width="140" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="90"  y="116" text-anchor="middle" font-size="12" font-weight="bold">C1</text>
  <text x="90"  y="134" text-anchor="middle" font-size="10" fill="#555">Physio-only baseline</text>
  <rect x="160" y="99" width="140" height="44" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="230" y="124" text-anchor="middle" font-size="18">✓</text>
  <rect x="300" y="99" width="140" height="44" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="124" text-anchor="middle" font-size="18" fill="#c0392b">✗</text>
  <rect x="440" y="99" width="220" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="550" y="124" text-anchor="middle" font-size="11" fill="#555">— (unimodal)</text>
  <rect x="660" y="99" width="140" height="44" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1"/>
  <text x="730" y="116" text-anchor="middle" font-size="10">Measures M1 alone</text>
  <text x="730" y="132" text-anchor="middle" font-size="10">vs literature ~73%</text>

  <!-- C2 -->
  <rect x="20"  y="143" width="140" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="90"  y="160" text-anchor="middle" font-size="12" font-weight="bold">C2</text>
  <text x="90"  y="178" text-anchor="middle" font-size="10" fill="#555">Video-only baseline</text>
  <rect x="160" y="143" width="140" height="44" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
  <text x="230" y="168" text-anchor="middle" font-size="18" fill="#c0392b">✗</text>
  <rect x="300" y="143" width="140" height="44" fill="#cce5ff" stroke="#004085" stroke-width="1.5"/>
  <text x="370" y="168" text-anchor="middle" font-size="18">✓</text>
  <rect x="440" y="143" width="220" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="550" y="168" text-anchor="middle" font-size="11" fill="#555">— (unimodal)</text>
  <rect x="660" y="143" width="140" height="44" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1"/>
  <text x="730" y="160" text-anchor="middle" font-size="10">Measures M2 alone</text>
  <text x="730" y="176" text-anchor="middle" font-size="10">vs literature ~65%</text>

  <!-- C3 -->
  <rect x="20"  y="187" width="140" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="90"  y="204" text-anchor="middle" font-size="12" font-weight="bold">C3</text>
  <text x="90"  y="222" text-anchor="middle" font-size="10" fill="#555">Equal-weight fusion</text>
  <rect x="160" y="187" width="140" height="44" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="230" y="212" text-anchor="middle" font-size="18">✓</text>
  <rect x="300" y="187" width="140" height="44" fill="#cce5ff" stroke="#004085" stroke-width="1.5"/>
  <text x="370" y="212" text-anchor="middle" font-size="18">✓</text>
  <rect x="440" y="187" width="220" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="550" y="204" text-anchor="middle" font-size="11">Equal weights</text>
  <text x="550" y="220" text-anchor="middle" font-size="10" fill="#555">w_physio = w_video = 0.5</text>
  <rect x="660" y="187" width="140" height="44" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1"/>
  <text x="730" y="204" text-anchor="middle" font-size="10">Does weighting help</text>
  <text x="730" y="220" text-anchor="middle" font-size="10">over naive fusion?</text>

  <!-- C4 -->
  <rect x="20"  y="231" width="140" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="90"  y="248" text-anchor="middle" font-size="12" font-weight="bold">C4</text>
  <text x="90"  y="266" text-anchor="middle" font-size="10" fill="#555">Conf-weighted (no quality)</text>
  <rect x="160" y="231" width="140" height="44" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="230" y="256" text-anchor="middle" font-size="18">✓</text>
  <rect x="300" y="231" width="140" height="44" fill="#cce5ff" stroke="#004085" stroke-width="1.5"/>
  <text x="370" y="256" text-anchor="middle" font-size="18">✓</text>
  <rect x="440" y="231" width="220" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="550" y="248" text-anchor="middle" font-size="11">Confidence-weighted</text>
  <text x="550" y="264" text-anchor="middle" font-size="10" fill="#555">α = 1.0 for all qualities</text>
  <rect x="660" y="231" width="140" height="44" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1"/>
  <text x="730" y="248" text-anchor="middle" font-size="10">Does quality penalty</text>
  <text x="730" y="264" text-anchor="middle" font-size="10">add value over conf?</text>

  <!-- C5 — highlighted as full method -->
  <rect x="20"  y="275" width="140" height="44" fill="#2c7bb6" stroke="#1a5276" stroke-width="2"/>
  <text x="90"  y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="white">C5 ★</text>
  <text x="90"  y="310" text-anchor="middle" font-size="10" fill="white">Full method</text>
  <rect x="160" y="275" width="140" height="44" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="230" y="300" text-anchor="middle" font-size="18">✓</text>
  <rect x="300" y="275" width="140" height="44" fill="#cce5ff" stroke="#004085" stroke-width="1.5"/>
  <text x="370" y="300" text-anchor="middle" font-size="18">✓</text>
  <rect x="440" y="275" width="220" height="44" fill="#2c7bb6" stroke="#1a5276" stroke-width="2"/>
  <text x="550" y="292" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Confidence + Quality Gating</text>
  <text x="550" y="308" text-anchor="middle" font-size="10" fill="white">g_m = c_m × α_m, L1-normalised</text>
  <rect x="660" y="275" width="140" height="44" fill="#2c7bb6" stroke="#1a5276" stroke-width="2"/>
  <text x="730" y="292" text-anchor="middle" font-size="10" fill="white">Primary method —</text>
  <text x="730" y="308" text-anchor="middle" font-size="10" fill="white">target: beat C1–C4</text>

  <!-- Section: Robustness -->
  <rect x="20" y="319" width="780" height="18" rx="0" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
  <text x="410" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#495057">Robustness Tests (using full method C5)</text>

  <!-- C6, C7, C8 in one row -->
  <rect x="20"  y="337" width="140" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="90"  y="354" text-anchor="middle" font-size="11" font-weight="bold">C6</text>
  <text x="90"  y="370" text-anchor="middle" font-size="9" fill="#555">Video quality = poor</text>
  <text x="90"  y="383" text-anchor="middle" font-size="9" fill="#555">α_video = 0.1</text>

  <rect x="160" y="337" width="280" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="300" y="354" text-anchor="middle" font-size="11" font-weight="bold">C7</text>
  <text x="300" y="370" text-anchor="middle" font-size="9" fill="#555">Video completely missing</text>
  <text x="300" y="383" text-anchor="middle" font-size="9" fill="#555">w_video → 0; physio only</text>

  <rect x="440" y="337" width="360" height="44" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="620" y="354" text-anchor="middle" font-size="11" font-weight="bold">C8</text>
  <text x="620" y="370" text-anchor="middle" font-size="9" fill="#555">Physio quality = poor; α_physio = 0.1</text>
  <text x="620" y="383" text-anchor="middle" font-size="9" fill="#555">Tests graceful degradation logic</text>

  <!-- Statistical test note -->
  <text x="410" y="405" text-anchor="middle" font-size="10" font-style="italic" fill="#555">Statistical significance: Wilcoxon signed-rank test, one-tailed, α = 0.05 — comparing C5 vs C1, C5 vs C2, C5 vs C3</text>
  <text x="410" y="420" text-anchor="middle" font-size="10" font-style="italic" fill="#555">Primary metric: Macro-averaged F1 score across all 5 emotion classes</text>
</svg>
