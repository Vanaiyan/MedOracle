<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif">
  <text x="410" y="26" text-anchor="middle" font-size="14" font-weight="bold">Figure 5.2: ResNet50 Encoder — Fine-Tuning Strategy</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="20" y="120" width="90" height="50" rx="5" fill="#2c7bb6" stroke="#1a5276" stroke-width="2"/>
  <text x="65" y="142" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Input Frame</text>
  <text x="65" y="157" text-anchor="middle" font-size="10" fill="white">(3×224×224)</text>
  <line x1="110" y1="145" x2="128" y2="145" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- FROZEN zone background -->
  <rect x="128" y="80" width="310" height="130" rx="8" fill="#ffe8e8" stroke="#c0392b" stroke-width="2" stroke-dasharray="7,3"/>
  <text x="283" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">FROZEN (requires_grad = False)</text>

  <!-- conv1/bn1 -->
  <rect x="138" y="108" width="80" height="50" rx="4" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.5"/>
  <text x="178" y="128" text-anchor="middle" font-size="10" font-weight="bold">conv1</text>
  <text x="178" y="142" text-anchor="middle" font-size="10">bn1 + relu</text>
  <text x="178" y="156" text-anchor="middle" font-size="9">(64 ch, 7×7)</text>
  <line x1="218" y1="133" x2="234" y2="133" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- layer1 -->
  <rect x="234" y="108" width="70" height="50" rx="4" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.5"/>
  <text x="269" y="128" text-anchor="middle" font-size="10" font-weight="bold">layer1</text>
  <text x="269" y="142" text-anchor="middle" font-size="9">256 ch</text>
  <text x="269" y="155" text-anchor="middle" font-size="9">56×56</text>
  <line x1="304" y1="133" x2="320" y2="133" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- layer2 -->
  <rect x="320" y="108" width="70" height="50" rx="4" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.5"/>
  <text x="355" y="128" text-anchor="middle" font-size="10" font-weight="bold">layer2</text>
  <text x="355" y="142" text-anchor="middle" font-size="9">512 ch</text>
  <text x="355" y="155" text-anchor="middle" font-size="9">28×28</text>
  <line x1="390" y1="133" x2="438" y2="133" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- TRAINABLE zone background -->
  <rect x="438" y="80" width="240" height="130" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2" stroke-dasharray="7,3"/>
  <text x="558" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">FINE-TUNED (requires_grad = True)</text>

  <!-- layer3 -->
  <rect x="448" y="108" width="70" height="50" rx="4" fill="#a9dfbf" stroke="#28a745" stroke-width="1.5"/>
  <text x="483" y="128" text-anchor="middle" font-size="10" font-weight="bold">layer3</text>
  <text x="483" y="142" text-anchor="middle" font-size="9">1024 ch</text>
  <text x="483" y="155" text-anchor="middle" font-size="9">14×14</text>
  <line x1="518" y1="133" x2="534" y2="133" stroke="#28a745" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- layer4 -->
  <rect x="534" y="108" width="70" height="50" rx="4" fill="#a9dfbf" stroke="#28a745" stroke-width="1.5"/>
  <text x="569" y="128" text-anchor="middle" font-size="10" font-weight="bold">layer4</text>
  <text x="569" y="142" text-anchor="middle" font-size="9">2048 ch</text>
  <text x="569" y="155" text-anchor="middle" font-size="9">7×7</text>
  <line x1="604" y1="133" x2="620" y2="133" stroke="#28a745" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- avgpool -->
  <rect x="620" y="108" width="50" height="50" rx="4" fill="#a9dfbf" stroke="#28a745" stroke-width="1.5"/>
  <text x="645" y="128" text-anchor="middle" font-size="10" font-weight="bold">avg</text>
  <text x="645" y="141" text-anchor="middle" font-size="10">pool</text>
  <text x="645" y="154" text-anchor="middle" font-size="9">1×1</text>
  <line x1="670" y1="133" x2="688" y2="133" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="688" y="108" width="100" height="50" rx="4" fill="#2c7bb6" stroke="#1a5276" stroke-width="2"/>
  <text x="738" y="128" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Feature</text>
  <text x="738" y="143" text-anchor="middle" font-size="10" fill="white">Vector</text>
  <text x="738" y="157" text-anchor="middle" font-size="10" fill="white">(2048-dim)</text>

  <!-- REMOVED FC label -->
  <rect x="688" y="220" width="100" height="40" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="738" y="236" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">fc (1000)</text>
  <text x="738" y="252" text-anchor="middle" font-size="9" fill="#999">REMOVED</text>
  <text x="738" y="272" text-anchor="middle" font-size="9" fill="#c0392b">✗ Not used</text>

  <!-- Parameter counts -->
  <text x="410" y="248" text-anchor="middle" font-size="11" fill="#555">Parameter breakdown:</text>
  <rect x="128" y="258" width="160" height="30" rx="4" fill="#ffe8e8" stroke="#c0392b" stroke-width="1"/>
  <text x="208" y="275" text-anchor="middle" font-size="10" fill="#c0392b">Frozen: ~3.5M params</text>
  <text x="208" y="287" text-anchor="middle" font-size="9" fill="#c0392b">(conv1 + bn1 + L1 + L2)</text>
  <rect x="438" y="258" width="160" height="30" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="518" y="275" text-anchor="middle" font-size="10" fill="#28a745">Trainable: ~20M params</text>
  <text x="518" y="287" text-anchor="middle" font-size="9" fill="#28a745">(L3 + L4 + avgpool)</text>
  <text x="738" y="276" text-anchor="middle" font-size="9" fill="#555">Total: ~23.5M</text>
</svg>
