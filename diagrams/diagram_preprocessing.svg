<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif">
  <text x="430" y="28" text-anchor="middle" font-size="14" font-weight="bold">Figure 5.1: Video Preprocessing Pipeline Flowchart</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#28a745"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- Step 1: Input -->
  <rect x="330" y="48" width="200" height="46" rx="22" fill="#2c7bb6" stroke="#1a5276" stroke-width="2"/>
  <text x="430" y="68" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Raw Video Clip</text>
  <text x="430" y="84" text-anchor="middle" font-size="10" fill="white">(any length, ~30 fps)</text>

  <!-- Arrow 1→2 -->
  <line x1="430" y1="94" x2="430" y2="112" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Step 2: Frame Sampling -->
  <rect x="310" y="112" width="240" height="46" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.8"/>
  <text x="430" y="132" text-anchor="middle" font-size="12" font-weight="bold">Uniform Frame Sampling</text>
  <text x="430" y="148" text-anchor="middle" font-size="10">Extract T=16 frames, stride = len / 16</text>

  <!-- Arrow 2→3 -->
  <line x1="430" y1="158" x2="430" y2="176" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Step 3: YOLO -->
  <rect x="310" y="176" width="240" height="46" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.8"/>
  <text x="430" y="196" text-anchor="middle" font-size="12" font-weight="bold">YOLOv8 Face Detection</text>
  <text x="430" y="212" text-anchor="middle" font-size="10">Detect bounding boxes (conf ≥ 0.40)</text>

  <!-- Arrow 3→ Decision -->
  <line x1="430" y1="222" x2="430" y2="242" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <polygon points="430,242 530,268 430,294 330,268" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1.8"/>
  <text x="430" y="264" text-anchor="middle" font-size="11" font-weight="bold">Face detected?</text>
  <text x="430" y="278" text-anchor="middle" font-size="10">in this frame</text>

  <!-- YES branch -->
  <line x1="530" y1="268" x2="640" y2="268" stroke="#28a745" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="577" y="260" text-anchor="middle" font-size="10" fill="#28a745">YES</text>
  <rect x="640" y="242" width="175" height="52" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="727" y="263" text-anchor="middle" font-size="11" font-weight="bold">Crop Face + Pad 20%</text>
  <text x="727" y="278" text-anchor="middle" font-size="10">Select largest bbox</text>
  <text x="727" y="291" text-anchor="middle" font-size="10">Clamp to frame bounds</text>

  <!-- NO branch -->
  <line x1="330" y1="268" x2="222" y2="268" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arro)"/>
  <text x="277" y="260" text-anchor="middle" font-size="10" fill="#e67e22">NO</text>
  <rect x="45" y="242" width="175" height="52" rx="5" fill="#ffe8cc" stroke="#e67e22" stroke-width="1.5"/>
  <text x="132" y="262" text-anchor="middle" font-size="11" font-weight="bold">Centre Fallback Crop</text>
  <text x="132" y="277" text-anchor="middle" font-size="10">60% centre region</text>
  <text x="132" y="291" text-anchor="middle" font-size="10">Record as undetected</text>

  <!-- Both branches → Resize -->
  <line x1="727" y1="294" x2="727" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="132" y1="294" x2="132" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="132" y1="330" x2="727" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="430" y1="330" x2="430" y2="344" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Step 5: Resize -->
  <rect x="310" y="344" width="240" height="32" rx="5" fill="#cce5ff" stroke="#004085" stroke-width="1.8"/>
  <text x="430" y="355" text-anchor="middle" font-size="11" font-weight="bold">Resize to 224 × 224</text>
  <text x="430" y="368" text-anchor="middle" font-size="10">INTER_AREA interpolation</text>

  <!-- Arrow → Normalise -->
  <line x1="550" y1="360" x2="660" y2="360" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Step 6: Normalise -->
  <rect x="660" y="344" width="180" height="32" rx="5" fill="#cce5ff" stroke="#004085" stroke-width="1.8"/>
  <text x="750" y="356" text-anchor="middle" font-size="10" font-weight="bold">ImageNet Normalise</text>
  <text x="750" y="369" text-anchor="middle" font-size="10">mean=[0.485,0.456,0.406]</text>

  <!-- Quality side box -->
  <rect x="45" y="344" width="190" height="46" rx="5" fill="#e2d9f3" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="140" y="362" text-anchor="middle" font-size="11" font-weight="bold">Signal Quality Assessment</text>
  <text x="140" y="376" text-anchor="middle" font-size="9">Det.Rate | Laplacian Var | BBox Area</text>
  <text x="140" y="389" text-anchor="middle" font-size="9">→ good / degraded / poor</text>
  <line x1="310" y1="360" x2="235" y2="360" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="430" y="420" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Green path: face detected. Orange path: fallback crop. Both paths rejoin at resize step.</text>
</svg>
