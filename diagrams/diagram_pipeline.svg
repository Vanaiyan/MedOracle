<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="bold">Figure 4.1: End-to-End MedOracle System Pipeline</text>

  <!-- ── INPUTS ── -->
  <rect x="20" y="60" width="110" height="44" rx="4" fill="#e8f4f8" stroke="#2c7bb6" stroke-width="1.5"/>
  <text x="75" y="80" text-anchor="middle" font-size="11" font-weight="bold">EEG Signals</text>
  <text x="75" y="95" text-anchor="middle" font-size="10">(32ch × 512 samples)</text>

  <rect x="20" y="120" width="110" height="44" rx="4" fill="#e8f4f8" stroke="#2c7bb6" stroke-width="1.5"/>
  <text x="75" y="140" text-anchor="middle" font-size="11" font-weight="bold">GSR Signals</text>
  <text x="75" y="155" text-anchor="middle" font-size="10">(512 samples @ 128Hz)</text>

  <rect x="20" y="330" width="110" height="44" rx="4" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1.5"/>
  <text x="75" y="350" text-anchor="middle" font-size="11" font-weight="bold">Facial Video</text>
  <text x="75" y="365" text-anchor="middle" font-size="10">(16 frames, 224×224)</text>

  <!-- ── MODULE 1 ── -->
  <rect x="175" y="55" width="165" height="120" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="257" y="77" text-anchor="middle" font-size="12" font-weight="bold">Member 1</text>
  <text x="257" y="92" text-anchor="middle" font-size="11">Physiological Module</text>
  <line x1="175" y1="100" x2="340" y2="100" stroke="#28a745" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="257" y="116" text-anchor="middle" font-size="10">EEG Preprocessing</text>
  <text x="257" y="130" text-anchor="middle" font-size="10">GSR Resampling</text>
  <text x="257" y="144" text-anchor="middle" font-size="10">BiAttn Network → 5-class</text>
  <text x="257" y="158" text-anchor="middle" font-size="10">Signal Quality Assessment</text>

  <!-- Arrows EEG/GSR → M1 -->
  <line x1="130" y1="82" x2="175" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="142" x2="175" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- M1 output box -->
  <rect x="380" y="60" width="155" height="95" rx="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.5"/>
  <text x="457" y="79" text-anchor="middle" font-size="10" font-style="italic">physiological_prediction_dict</text>
  <line x1="380" y1="85" x2="535" y2="85" stroke="#6c757d" stroke-width="1"/>
  <text x="457" y="101" text-anchor="middle" font-size="10">predicted_emotion: str</text>
  <text x="457" y="115" text-anchor="middle" font-size="10">confidence: float</text>
  <text x="457" y="129" text-anchor="middle" font-size="10">class_probabilities: dict</text>
  <text x="457" y="143" text-anchor="middle" font-size="10">signal_quality: {eeg, gsr}</text>

  <!-- Arrow M1 → M1 output -->
  <line x1="340" y1="115" x2="380" y2="107" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <!-- ── MODULE 2 ── -->
  <rect x="175" y="290" width="165" height="140" rx="6" fill="#cce5ff" stroke="#004085" stroke-width="2"/>
  <text x="257" y="312" text-anchor="middle" font-size="12" font-weight="bold">Member 2</text>
  <text x="257" y="327" text-anchor="middle" font-size="11">Video + Fusion Module</text>
  <line x1="175" y1="335" x2="340" y2="335" stroke="#004085" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="257" y="351" text-anchor="middle" font-size="10">YOLO Face Detection</text>
  <text x="257" y="365" text-anchor="middle" font-size="10">ResNet50 Frame Encoder</text>
  <text x="257" y="379" text-anchor="middle" font-size="10">BiLSTM Temporal Model</text>
  <text x="257" y="393" text-anchor="middle" font-size="10">Gated Fusion (+ M1 output)</text>
  <text x="257" y="407" text-anchor="middle" font-size="10">Graceful Degradation</text>
  <text x="257" y="421" text-anchor="middle" font-size="10">Signal Quality Assessment</text>

  <!-- Arrow Video → M2 -->
  <line x1="130" y1="352" x2="175" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow M1 output → M2 (vertical) -->
  <line x1="457" y1="155" x2="457" y2="250" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowgray)"/>
  <line x1="457" y1="250" x2="257" y2="290" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowgray)"/>

  <!-- M2 output box -->
  <rect x="380" y="290" width="155" height="140" rx="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.5"/>
  <text x="457" y="309" text-anchor="middle" font-size="10" font-style="italic">prediction_output</text>
  <line x1="380" y1="315" x2="535" y2="315" stroke="#6c757d" stroke-width="1"/>
  <text x="457" y="331" text-anchor="middle" font-size="10">predicted_emotion: str</text>
  <text x="457" y="345" text-anchor="middle" font-size="10">confidence: float</text>
  <text x="457" y="359" text-anchor="middle" font-size="10">class_probabilities: dict</text>
  <text x="457" y="373" text-anchor="middle" font-size="10">modality_weights: dict</text>
  <text x="457" y="387" text-anchor="middle" font-size="10">signal_quality: dict</text>
  <text x="457" y="401" text-anchor="middle" font-size="10">per_modality_predictions</text>

  <!-- Arrow M2 → M2 output -->
  <line x1="340" y1="360" x2="380" y2="360" stroke="#004085" stroke-width="1.5" marker-end="url(#arrowblue)"/>

  <!-- ── MODULE 3 ── -->
  <rect x="580" y="185" width="175" height="230" rx="6" fill="#f8d7da" stroke="#721c24" stroke-width="2"/>
  <text x="667" y="207" text-anchor="middle" font-size="12" font-weight="bold">Member 3</text>
  <text x="667" y="222" text-anchor="middle" font-size="11">Explainability + Web App</text>
  <line x1="580" y1="230" x2="755" y2="230" stroke="#721c24" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="667" y="248" text-anchor="middle" font-size="10">Kernel SHAP</text>
  <text x="667" y="262" text-anchor="middle" font-size="10">Faithfulness Metric</text>
  <text x="667" y="276" text-anchor="middle" font-size="10">FastAPI (9 endpoints)</text>
  <text x="667" y="290" text-anchor="middle" font-size="10">PostgreSQL Database</text>
  <text x="667" y="304" text-anchor="middle" font-size="10">React Dashboard</text>
  <text x="667" y="318" text-anchor="middle" font-size="10">LLM Chatbot</text>

  <!-- Arrows outputs → M3 -->
  <line x1="535" y1="107" x2="667" y2="185" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowgray)"/>
  <line x1="535" y1="360" x2="667" y2="415" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowgray)"/>
  <line x1="667" y1="415" x2="667" y2="415" stroke="none"/>

  <!-- Arrow from M2 output up to M3 -->
  <line x1="535" y1="360" x2="580" y2="300" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowgray)"/>

  <!-- Final outputs -->
  <rect x="790" y="185" width="95" height="40" rx="4" fill="#e2d9f3" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="837" y="200" text-anchor="middle" font-size="10" font-weight="bold">SHAP Values</text>
  <text x="837" y="214" text-anchor="middle" font-size="10">+ Explanations</text>

  <rect x="790" y="245" width="95" height="40" rx="4" fill="#e2d9f3" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="837" y="260" text-anchor="middle" font-size="10" font-weight="bold">React</text>
  <text x="837" y="274" text-anchor="middle" font-size="10">Dashboard</text>

  <rect x="790" y="305" width="95" height="40" rx="4" fill="#e2d9f3" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="837" y="320" text-anchor="middle" font-size="10" font-weight="bold">LLM Chatbot</text>
  <text x="837" y="334" text-anchor="middle" font-size="10">Interface</text>

  <line x1="755" y1="210" x2="790" y2="205" stroke="#721c24" stroke-width="1.2" marker-end="url(#arrowred)"/>
  <line x1="755" y1="265" x2="790" y2="265" stroke="#721c24" stroke-width="1.2" marker-end="url(#arrowred)"/>
  <line x1="755" y1="320" x2="790" y2="325" stroke="#721c24" stroke-width="1.2" marker-end="url(#arrowred)"/>

  <!-- Legend -->
  <rect x="20" y="455" width="860" height="50" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="473" font-size="10" font-weight="bold">Legend:</text>
  <rect x="90" y="462" width="14" height="14" fill="#d4edda" stroke="#28a745"/>
  <text x="108" y="473" font-size="10">Member 1 (Physiological)</text>
  <rect x="255" y="462" width="14" height="14" fill="#cce5ff" stroke="#004085"/>
  <text x="273" y="473" font-size="10">Member 2 (Video + Fusion)</text>
  <rect x="420" y="462" width="14" height="14" fill="#f8d7da" stroke="#721c24"/>
  <text x="438" y="473" font-size="10">Member 3 (Explainability + Web)</text>
  <rect x="610" y="462" width="14" height="14" fill="#f8f9fa" stroke="#6c757d"/>
  <text x="628" y="473" font-size="10">Interface contract dict</text>
  <rect x="750" y="462" width="14" height="14" fill="#e2d9f3" stroke="#6f42c1"/>
  <text x="768" y="473" font-size="10">Final output</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#28a745"/>
    </marker>
    <marker id="arrowblue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#004085"/>
    </marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c757d"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#721c24"/>
    </marker>
  </defs>
</svg>
